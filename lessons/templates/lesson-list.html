{% extends 'base.html' %}
{% block content %}
<div id="lesson">
    {% include 'partials/add-lesson.html' %}
    
    {% if lessons %}
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Topic</th>
                <th colspan="3">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for lesson in lessons %}
            <tr>
                <td>{{lesson.id}}</td>
                <td>{{lesson.topic}}</td>
                <td colspan="3">
                    <button
                    hx-post="{% url 'get_lesson' lesson.id %}" 
                    hx-target="#lesson" 
                    hx-swap="outerHTML"

                    >Detail</button>
                    <button 
                    hx-post="{% url 'lesson_update' lesson.id %}" 
                    hx-target="#lesson-{{lesson.id}}" 
                    hx-swap="outerHTML"
                    >Edit</button>
                    
                    <button
                    hx-delete="{% url 'lesson_delete' lesson.id %}" 
                    hx-target="#lesson-{{lesson.id}}" 
                    hx-swap="outerHTML"
                    >Delete</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
        <h1 class="text-danger">No lesson !</h1>
    {% endif %}

</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col items-center min-h-screen">
        
    <!-- NON-AUTHENTICATED USERS -->
        <div id="account-main-section" class="flex items-center justify-evenly w-full">            
                
            <div>
                <p>Already have an account ? </p>
                <button
                class="btn btn-accent"
                hx-get="{% url 'login' %}"
                hx-target="#modal-body"
                hx-swap="innerHTML"
                hx-on:click="openModal()"
                >
                <i data-lucide="log-in"></i>
                Login
            </button>
            </div>

            <p>Or Register Below</p>

        
            <div>
                <button
                class="btn btn-accent"
                hx-get="{% url 'register' %}"
                hx-target="#modal-body"
                hx-swap="innerHTML"
                hx-on:click="openModal()"
                > 
                <i data-lucide="notebook-pen"></i>
                Register</button>
            </div>
        </div>


        <!-- LOGGED IN USERS SERVIES GO HERE -->
        {% if request.user.is_authenticated %}
            <div id="logged-in" class="flex flex-col space-y-3">
                
                <div>
                    {% include 'accounts/partials/profile.html'%}
                    
                </div>
                {% endif %}

            </div>

</div>

{% endblock %}

{% extends 'base.html' %}

{% block content %}

    <button 
    class="btn btn-primary"
    hx-on:click="document.getElementById('add').style.display = 'block' "
    hx-swap="outerHTML"
    hx-target="#add"
    > Add Lesson </button>
    {% include 'lessons/partials/add-lesson.html' %}
    
    {% if lessons %}
    <ul id="lesson-list">
        {% for lesson in lessons %}
           {% include 'lessons/partials/lesson-item.html' %}
        {% endfor %}
    </ul>
    
    {% else %}
        <h1 class="text-danger">No lesson !</h1>
    {% endif %}

</div>
{% endblock %}

    <div class="hidden bg-amber-900 p-2 rounded-lg flex flex-col items-center justify-center" id="add">
        <button
        class="btn"
        hx-on:click="document.getElementById('add').style.display= 'none' "
        > Close</button>
        <h1>CREATE LESSON BELOW</h1>
        <form hx-post="{% url 'create_lesson' %}" hx-target="afterbegin" hx-swap="outerHTML">
            {% csrf_token %}
            {{ form }}
            {% if form.errors %}
                <p class="text-red-900 rounded-full px-4 py-1"> {{ form.errors }}</p>
            {% endif %}
            <button> Create Lesson </button>
        </form>
    </div>

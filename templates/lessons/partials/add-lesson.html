<form 
hx-post="{% url 'create_lesson' %}" 
hx-target="#lesson-list" 
hx-swap="outerHTML"
hx-on:afterRequest="closeModal()"
>
    {% csrf_token %}
    {{ form }}
    {% if form.errors %}
        <p class="text-red-900 rounded-full px-4 py-1"> {{ form.errors }}</p>
    {% endif %}
    <button> Create </button>
</form>

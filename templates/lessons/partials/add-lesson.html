<form 
hx-post="{% url 'lessons:create_lesson' %}" 
hx-target="#lesson-row" 
hx-swap="outerHTML"
hx-on::after-request="closeModal()"
>
    {% csrf_token %}
    {{ form }}
    {% if form.errors %}
        <p class="text-red-900 rounded-full px-4 py-1"> {{ form.errors }}</p>
    {% endif %}
    <button class="btn btn-accent"> Create </button>
</form>

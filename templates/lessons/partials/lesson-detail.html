<div class="p-2 border rounded-md shadow-xl flex flex-col justify-center items-center m-2">
    <h1 class="text-success text-xl">{{ lesson.topic }}</h1>
    <div>
        <h1>Summary: {{ lesson.summary}}</h1>
        <h1>Date Created: {{ lesson.created_at}}</h1>
        <h1>Author: {{ lesson.user}}</h1>
    
        <button class="btn" 
        hx-get="{% url 'get_lessons' %}" 
        hx-target="#lesson-list" 
        hx-swap="innerHTML" 
        >Back</button>
    </div>

</div>
